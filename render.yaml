databases:
  - name: ecosync-hub-db
    plan: free
    databaseName: ecosync_hub

services:
  # Backend Web Service
  - type: web
    name: ecosync-hub-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecosync-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://ecosync-hub.com
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: ecosync-hub-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    domains:
      - ecosync-hub.com
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecosync-hub-backend
          property: host
        prefix: https://
        suffix: /api
