databases:
  - name: ecosync-hub-db
    plan: free
    databaseName: ecosync_hub

services:
  # Backend Web Service
  - type: web
    name: ecosync-hub-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ecosync-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: static_site
          name: ecosync-hub-frontend
          property: url

staticSites:
  - name: ecosync-hub-frontend
    env: static
    plan: free
    domains:
      - ecosync-hub.com
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecosync-hub-backend
          property: url
        suffix: /api
